[runner]
benchmark_root = "dynamic-benchmarks"
dpus = [64, 128, 256, 512, 1024, 2048]
warmup = 0
iterations = 20
ntrials = 5
seed = 1
variants = [
  "polymerpim-jit",
  "polymerpim-hybrid",
  "polymerpim-pipeline",
  "polymerpim-eager",
]
group_by_variant = true

[[adaptive_image]]
elements_per_dpu = [262144, 524288]
parameters = { channels = 4, check_interval = 2, tolerance = 2 }

[[dynamic_query]]
dpus = [64]
iterations = 10
# Below ~1M elements the fixed JIT compile cost dominates and every variant
# just measures compiler overhead; start where execution dominates.
elements_per_dpu = [16384, 65536, 262144, 524288]
variants = [
  "polymerpim-jit",
  "polymerpim-hybrid",
  "polymerpim-pipeline",
  "simplepim",
]
parameters = { columns = 4, batches_per_query = 5, query_ops = 6 }
